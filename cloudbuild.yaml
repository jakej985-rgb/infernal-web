steps:
# Build image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/421970311289/infernal-web', '.']

# Push image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/421970311289/infernal-web']

# Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - run
    - deploy
    - infernal-web
    - --image=gcr.io/421970311289/infernal-web
    - --region=us-central1
    - --platform=managed
    - --allow-unauthenticated

images:
- gcr.io/421970311289/infernal-web
