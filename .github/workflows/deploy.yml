name: Deploy to Cloud Run

on:
  workflow_dispatch:

env:
  PROJECT_ID: m3tal-project
  API_SERVICE_NAME: infernal-api
  WEB_SERVICE_NAME: infernal-web
  REGION: us-central1
  API_IMAGE: gcr.io/m3tal-project/infernal-api
  WEB_IMAGE: gcr.io/m3tal-project/infernal-web

jobs:
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker --quiet

      - name: Build and Push Docker Images
        run: |
          # Build and push Go API
          docker build -t ${{ env.API_IMAGE }} -f backend/Dockerfile backend
          docker push ${{ env.API_IMAGE }}
          
          # Build and push Flutter Web
          docker build -t ${{ env.WEB_IMAGE }} -f Dockerfile .
          docker push ${{ env.WEB_IMAGE }}

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.API_SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.API_IMAGE }}
          flags: '--allow-unauthenticated --add-cloudsql-instances=m3tal-project:us-central1:infernal-db --set-env-vars=DB_USER=m3tal,DB_NAME=infernal,DB_HOST=/cloudsql/m3tal-project:us-central1:infernal-db'

      - name: Deploy Web to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WEB_SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.WEB_IMAGE }}
          flags: '--allow-unauthenticated'
