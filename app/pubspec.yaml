name: infernal_ink_steel
description: "Infernal Ink & Steel Suite - Tattoo Shop Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.0.0

  # Database (Drift/SQLite)
  drift: ^2.30.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.33
  path_provider: ^2.1.5
  path: ^1.9.1

  # Data Classes
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^7.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  rxdart: ^0.28.0
  table_calendar: ^3.2.0
  bcrypt: ^1.2.0
  image_picker: ^1.2.1
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.0
  freezed: ^3.2.0
  json_serializable: ^6.9.5
  drift_dev: ^2.30.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
